<style>
/* Layout: arcade column — HUD strip, 16:9 scene canvas with story cards over it, touch pad below */
:root{
  --frame:#1e3a5f; --frame2:#13283f; --paper:#fff8e8; --paper-d:#f1e2bf;
  --ink:#1a1410; --sun:#ffc93c; --sky:#3d8bd9; --leaf:#3fa34d; --berry:#e2475e; --grape:#7a4fc9;
  --font:"Noto Sans Hebrew",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--frame2);color:var(--paper);height:100%}
body{font-family:var(--font);direction:rtl;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;overflow:hidden;overscroll-behavior:none}
.cab{height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.cab>.top,.cab>.hud,.cab>.pad,.cab>.keys,.cab>.rot{width:var(--gw,100%);max-width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-weight:900;font-size:clamp(22px,4vw,34px);margin:0;color:var(--sun);text-wrap:balance;line-height:1.6}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.hud{display:flex;flex-wrap:wrap;gap:4px 18px;background:var(--frame);border:2px solid var(--ink);border-radius:10px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.8}
.hud b{color:var(--sun)}
.screen{position:relative;flex:none;width:var(--gw,100%);height:var(--gh,auto);aspect-ratio:16/9;max-width:100%;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 6px 0 var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.rhythmOnly{display:none!important}
.isRhythm .rhythmOnly{display:flex!important}
.isRhythm .walkOnly{display:none!important}
.runnerOnly{display:none!important}
.campOnly{display:none!important}
.isCamp .campOnly{display:flex!important}
.isCamp .walkOnly{display:none!important}
.isRunner .runnerOnly{display:flex!important}
.isRunner .walkOnly{display:none!important}
.panel.top{align-items:flex-start;background:transparent;pointer-events:none}
.panel.top .card{pointer-events:auto;max-height:46%}
#mpad{position:absolute;inset:0;z-index:4;pointer-events:none}
.card{position:relative}
#btnMenu{display:inline-flex}
.topbtns .more{display:none!important}
.compact #btnMenu,.portrait #btnMenu{display:inline-flex}
.compact .topbtns .more,.portrait .topbtns .more{display:none!important}
.portrait h1{display:none}
.portrait>.top{justify-content:center}
.portrait .topbtns{justify-content:center;gap:4px;flex-wrap:nowrap}
.portrait .topbtns button{font-size:13px;min-height:38px;padding:0 7px;white-space:nowrap}
.rot span{font-size:12px;line-height:1.5}
#menuSheet{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:12px}
#menuSheet[hidden]{display:none}
.msCard{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.msGrid button{min-height:52px;font-size:16px}
.compact .panelOpen>.pad,.portrait.panelOpen>.pad,.compact.panelOpen>.pad{visibility:hidden}
.compact.panelFull .panel{padding-top:max(44px,env(safe-area-inset-top,0px))}
.ttsNow{outline:3px solid #ffc93c;outline-offset:2px;background:#fff6c9!important;border-radius:8px}
@media (max-width:480px){.mapdesc{display:none}.card{padding:10px 12px;gap:6px}.grid{grid-template-columns:repeat(2,1fr)}.tile{padding:6px;line-height:1.5}.tile .ic{font-size:26px}.who img{width:36px;height:36px}.say{padding:4px 10px}.calbar{font-size:13px;padding:3px 8px}}
@media (max-height:440px){.card{padding:8px 14px;gap:6px}h2{font-size:19px;line-height:1.5}.who img{width:34px;height:34px}.rbig{font-size:clamp(44px,15vh,90px)}.remoji{font-size:50px}.rtile{min-height:50px;font-size:30px}.rbuilt{min-height:54px;font-size:40px}.rstory{font-size:21px;line-height:1.8;padding:6px 12px}.tile{line-height:1.45}.grid{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}.calbar{font-size:13px;padding:2px 8px}.say{padding:4px 10px}.ccwrap canvas{width:110px;height:140px}}
.ttsBtn{position:absolute;left:10px;bottom:10px;display:none;min-width:0!important;min-height:0!important;width:40px;height:40px;border-radius:50%;padding:0;font-size:20px;background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);z-index:2}
.sw{width:34px;height:34px;min-width:0!important;min-height:0!important;border-radius:50%;padding:0;border:3px solid var(--ink);box-shadow:none;margin:2px}
.sw.sel{outline:4px solid #ffc93c;outline-offset:1px;transform:scale(1.12)}
.ccwrap{display:flex;gap:12px;align-items:flex-start}
.ccwrap canvas{border:3px solid var(--ink);border-radius:14px;flex:none;width:150px;height:190px}
.ccopts{display:flex;flex-direction:column;gap:6px;flex:1}
.ccrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ccrow input{font:inherit;font-size:18px;padding:6px 10px;border:3px solid var(--ink);border-radius:10px;min-width:0;flex:1;max-width:240px}
.calbar{background:#fff8e1;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dbar{background:#eaf7e4}
@media (max-width:560px){.ccwrap{flex-direction:column;align-items:center}}
.rfont,.rbig,.rtile,.rstory,.rbuilt{font-family:"Frank Ruhl Libre","David Libre","Noto Serif Hebrew",serif}
.rbig{font-size:clamp(56px,11vw,104px);font-weight:700;text-align:center;line-height:1.35}
.rbig.rsent{font-size:clamp(26px,4.6vw,40px);line-height:1.7}
.rblank{color:#2f80ed;letter-spacing:2px}
.remoji{font-size:72px;text-align:center;line-height:1.1}
.rtile{font-size:clamp(28px,5.5vw,44px);font-weight:700;min-width:72px;min-height:64px;padding:2px 14px;line-height:1.3}
.rtile.remo{font-family:inherit;font-size:42px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rbuilt{min-height:72px;font-size:56px;font-weight:700;text-align:center;border:3px dashed var(--ink);border-radius:14px;background:#fff}
.rprog{height:10px;background:#e3e3e3;border-radius:6px;overflow:hidden;flex:none}.rprog i{display:block;height:100%;background:#7ed957;transition:width .3s}
.rstory{font-size:clamp(22px,4.2vw,32px);line-height:2;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 16px}
.world{border:3px solid var(--ink);border-radius:16px;padding:8px 10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.w-home{background:#f2fbef}.w-miv{background:#fffbe6;border-color:#1d4fa3}.w-chag{background:#eef5ff}.w-sim{background:#fbf0ff}
.whead{display:flex;gap:10px;align-items:center;line-height:1.4}.whead .ic{font-size:34px}.whead small{display:block;font-size:12px;color:#5a4a3a}
.trail{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 4px}
.mnode{flex:0 0 104px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative}
.mnode:not(:last-child)::after{content:'';position:absolute;top:34px;left:-20px;width:24px;border-top:4px dashed #c9a94a}
.mcirc{width:66px!important;height:66px;min-width:0!important;min-height:0!important;border-radius:50%!important;font-size:30px;padding:0!important;position:relative;border:4px solid var(--ink)}
.lv1 .mcirc{background:#bff0b0}.lv2 .mcirc{background:#ffd98a}.lv3 .mcirc{background:#d9c2ff}
.mnode.done .mcirc{box-shadow:0 0 0 4px #7ed957}.mnode.lock{opacity:.55}
.mcirc i{position:absolute;bottom:-4px;left:-4px;background:#3fae5a;color:#fff;border-radius:50%;width:24px;height:24px;font-style:normal;font-size:14px;line-height:24px}
.mnode b{font-size:13px;line-height:1.3}.mnode small{font-size:11px}
.miv10{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}.miv10 span{background:#fff;border:1px solid #e6c860;border-radius:10px;padding:0 6px}
.shcity{display:flex;flex-wrap:wrap;gap:6px}
.recl{display:flex;flex-direction:column;gap:4px}.recr{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid #ddd;border-radius:10px;padding:3px 8px}.recr.on{border-color:#3fae5a;background:#effbea}.recr span{font-size:20px}
.shlv{border:3px solid var(--ink);border-radius:14px;padding:6px 8px;background:#fff;display:flex;flex-direction:column;gap:6px}.shlv.lock{opacity:.55}
.shcity button{font-size:17px}.shcity small{font-size:13px}
.tbar{height:12px;background:#e3e3e3;border-radius:8px;overflow:hidden;flex:none}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e2475e,#ffd400,#7ed957)}
.pump{height:18px;background:#e3e3e3;border-radius:10px;overflow:hidden}.pump i{display:block;height:100%;background:#2f80ed}
.letter{background:#fffdf3;border:3px dashed #c9a94a;border-radius:14px;padding:12px 18px;font-size:22px;line-height:1.8}
.hlv{display:flex;flex-wrap:wrap;gap:6px}.hlv span{border:2px solid #ccc;border-radius:10px;padding:2px 8px;opacity:.5;font-weight:700}.hlv span.on{opacity:1;border-color:#3fae5a;background:#effbea}

    ['מָתַי מַדְלִיקִים נֵרוֹת שַׁבָּת?','בְּיוֹם שִׁשִּׁי לִפְנֵי הַשְּׁקִיעָה','בְּמוֹצָאֵי שַׁבָּת','בְּאֶמְצַע הַלַּיְלָה','מַדְלִיקִים לִפְנֵי שֶׁשַּׁבָּת נִכְנֶסֶת.'],
    ['מָה כָּתוּב בַּקְּלָפִים שֶׁבְּתוֹךְ הַתְּפִלִּין?','פְּסוּקִים מֵהַתּוֹרָה, כְּמוֹ "שְׁמַע יִשְׂרָאֵל"','רְשִׁימַת קְנִיּוֹת','בְּדִיחוֹת','סוֹפֵר סְתָ"ם כּוֹתֵב אוֹתָם בְּיָד, אוֹת אַחַר אוֹת.']],
 2:[['כַּמָּה מִינִים לוֹקְחִים בְּסֻכּוֹת?','אַרְבָּעָה','שִׁבְעָה','שְׁנַיִם','אֶתְרוֹג, לוּלָב, הֲדַסִּים וַעֲרָבוֹת.'],
    ['מִמָּה עוֹשִׂים סְכָךְ לַסֻּכָּה?','מֵעֲנָפִים וּצְמָחִים','מִבַּד צִבְעוֹנִי','מִקַּרְטוֹן שֶׁל פִּיצָה','הַסְּכָךְ צָרִיךְ לִהְיוֹת מִמָּה שֶׁגָּדֵל מִן הָאֲדָמָה.'],
    ['לְאֵיזֶה מִין יֵשׁ גַּם טַעַם וְגַם רֵיחַ?','לָאֶתְרוֹג','לָעֲרָבָה','לַלּוּלָב','הָאֶתְרוֹג טָעִים וְגַם מֵרִיחַ טוֹב.'],
    ['כַּמָּה יָמִים גָּרִים בַּסֻּכָּה?','שִׁבְעָה','יוֹם אֶחָד','מֵאָה','שִׁבְעָה יָמִים שֶׁל שִׂמְחָה!'],
    ['מָה עוֹשִׂים בְּשִׂמְחַת תּוֹרָה?','רוֹקְדִים עִם סֵפֶר הַתּוֹרָה','יְשֵׁנִים כָּל הַיּוֹם','אוֹכְלִים מַצּוֹת','מְסַיְּמִים אֶת הַתּוֹרָה וּמַתְחִילִים מֵהַהַתְחָלָה!']],
 3:[['כַּמָּה יָמִים חוֹגְגִים חֲנֻכָּה?','שְׁמוֹנָה','שִׁבְעָה','שְׁלוֹשָׁה','כִּי הַשֶּׁמֶן דָּלַק שְׁמוֹנָה יָמִים.'],
    ['אֵיךְ קוֹרְאִים לַנֵּר שֶׁמַּדְלִיק אֶת כָּל הַנֵּרוֹת?','שַׁמָּשׁ','גַּפְרוּר','פָּנָס','הַשַּׁמָּשׁ עוֹמֵד לְמַעְלָה וְעוֹזֵר לְכֻלָּם.'],
    ['מָה מָצְאוּ הַמַּכַּבִּים בַּמִּקְדָּשׁ?','פַּךְ שֶׁמֶן קָטָן','פִּיצָה','אוֹצָר זָהָב','פַּךְ קָטָן – וְנֵס גָּדוֹל!'],
    ['מָה כָּתוּב עַל סְבִיבוֹן בְּאֶרֶץ יִשְׂרָאֵל?','נֵס גָּדוֹל הָיָה פֹּה','חַג שָׂמֵחַ לְכֻלָּם','שַׁבָּת שָׁלוֹם','נ-ג-ה-פ. בְּחוּץ לָאָרֶץ כּוֹתְבִים ש: "הָיָה שָׁם".'],
    ['מָה אוֹכְלִים בַּחֲנֻכָּה?','סֻפְגָּנִיּוֹת וּלְבִיבוֹת','מַצּוֹת','אָזְנֵי הָמָן','מַאֲכָלִים בְּשֶׁמֶן – לְזֵכֶר נֵס הַשֶּׁמֶן.']],
 5:[['אִמָּא מְבַקֶּשֶׁת עֶזְרָה, וְאַתָּה בְּאֶמְצַע מִשְׂחָק. מָה עוֹשִׂים?','עוֹזְרִים מִיָּד, בְּשִׂמְחָה','מְחַכִּים שֶׁהִיא תְּבַקֵּשׁ עוֹד חָמֵשׁ פְּעָמִים','מִתְחַבְּאִים מִתַּחַת לַמִּטָּה','זֶה כִּבּוּד אָב וָאֵם – וְזֶה עוֹשֶׂה לָהּ שִׂמְחָה גְּדוֹלָה.'],
    ['לָמָּה שָׂמִים שְׁתֵּי חַלּוֹת בְּשַׁבָּת?','זֵכֶר לַמָּן הַכָּפוּל שֶׁיָּרַד בְּעֶרֶב שַׁבָּת','כִּי אַחַת לֹא מַסְפִּיקָה לַחֲתוּל','סְתָם, כִּי זֶה יָפֶה','בַּמִּדְבָּר יָרַד בְּיוֹם שִׁשִּׁי מָן כָּפוּל, לְשִׁשִּׁי וּלְשַׁבָּת.'],
    ['אֵיפֹה שָׂמִים סִדּוּר וְחֻמָּשׁ?','עַל הַמַּדָּף, בְּכָבוֹד','עַל הָרִצְפָּה','בְּאַרְגַּז הַצַּעֲצוּעִים','סִפְרֵי קֹדֶשׁ שׁוֹמְרִים בְּכָבוֹד, וְלֹא מְנִיחִים אוֹתָם הָפוּךְ.'],
    ['מָה שָׂמִים עַל הַחַלּוֹת לִפְנֵי הַקִּדּוּשׁ?','כִּסּוּי חַלָּה','כּוֹבַע','צַלַּחַת מָרָק','מְכַסִּים אֶת הַחַלּוֹת עַד אַחֲרֵי הַקִּדּוּשׁ.'],
    ['בְּאֵיזֶה דִּבֵּר כָּתוּב "כַּבֵּד אֶת אָבִיךָ וְאֶת אִמֶּךָ"?','בַּדִּבֵּר הַחֲמִישִׁי','בַּדִּבֵּר הָרִאשׁוֹן','זֶה בִּכְלָל לֹא בַּדִּבְּרוֹת','וְהַבְטָחָה עָלָיו: "לְמַעַן יַאֲרִכוּן יָמֶיךָ".']],
 6:[['מָה אוֹמְרִים מִיָּד כְּשֶׁמִּתְעוֹרְרִים?','מוֹדֶה אֲנִי','לַיְלָה טוֹב','מַזָּל טוֹב','מוֹדִים לַה׳ שֶׁהֶחֱזִיר לָנוּ אֶת הַנְּשָׁמָה.'],
    ['אֵיךְ נוֹטְלִים נֶעגְל וַאסֶער?','יָמִין, שְׂמֹאל – שָׁלוֹשׁ פְּעָמִים לְסֵרוּגִין','רַק עַל יָד אַחַת','קוֹפְצִים לַבְּרֵכָה','מַתְחִילִים תָּמִיד בְּיַד יָמִין.'],
    ['אֵיזוֹ בְּרָכָה מְבָרְכִים עַל בָּנָנָה?','בּוֹרֵא פְּרִי הָאֲדָמָה','בּוֹרֵא פְּרִי הָעֵץ','הַמּוֹצִיא','הַבָּנָנָה גְּדֵלָה עַל צֶמַח שֶׁאֵינוֹ עֵץ שֶׁל מַמָּשׁ.'],
    ['מָה עוֹשִׂים לִפְנֵי שֶׁאוֹכְלִים לֶחֶם?','נוֹטְלִים יָדַיִם וּמְבָרְכִים','רוֹקְדִים','מְצַחְצְחִים נַעֲלַיִם','וְלֹא מְדַבְּרִים בֵּין הַנְּטִילָה לְ"הַמּוֹצִיא".'],
    ['מָה אוֹמְרִים בִּקְרִיאַת שְׁמַע לִפְנֵי הַשֵּׁנָה?','שְׁמַע יִשְׂרָאֵל','בּוֹקֶר טוֹב','הַמּוֹצִיא','מְכַסִּים אֶת הָעֵינַיִם וְאוֹמְרִים בְּכַוָּנָה.'],
    ['מָתַי מְצַחְצְחִים שִׁנַּיִם?','בַּבֹּקֶר וּבָעֶרֶב','פַּעַם בְּשָׁנָה','רַק בְּפוּרִים','שׁוֹמְרִים עַל הַגּוּף – זוֹ מִצְוָה!']],
 7:[['הַשְׁלֵם: "עִבְדוּ אֶת ה׳ בְּ..."','שִׂמְחָה','עֶצֶב','שֶׁקֶט','זֶה פָּסוּק מִסֵּפֶר תְּהִלִּים.'],
    ['הַשְׁלֵם: "הִנֵּה מַה טּוֹב וּמַה נָּעִים שֶׁבֶת ... גַּם יָחַד"','אַחִים','חֲתוּלִים','מְלָכִים','אַחְדוּת וְאַהֲבַת יִשְׂרָאֵל!'],
    ['מָה זֶה נִגּוּן?','שִׁיר מֵהַלֵּב, הַרְבֵּה פְּעָמִים בְּלִי מִלִּים','סוּג שֶׁל עוּגָה','מִשְׂחַק כַּדּוּר','בְּנִגּוּן חֲסִידִי שָׁרִים "בַּאי בַּאי" – וְהַלֵּב מְדַבֵּר.'],
    ['לָמָּה שָׁרִים וְרוֹקְדִים בְּשִׂמְחָה?','כִּי שִׂמְחָה מְקָרֶבֶת לַה׳','כְּדֵי לְהָעִיר אֶת הַשְּׁכֵנִים','סְתָם, בְּלִי סִבָּה','שִׂמְחָה פּוֹרֶצֶת גֶּדֶר!'],
    ['הַשְׁלֵם: "וְשָׂמַחְתָּ בְּ... וְהָיִיתָ אַךְ שָׂמֵחַ"','חַגֶּךָ','שִׁעוּרֶיךָ','חֲלוֹמְךָ','פָּסוּק מִסֵּפֶר דְּבָרִים, עַל הַחַגִּים.']],
 8:[['בְּאֵיזֶה צַד שֶׁל הַפֶּתַח קוֹבְעִים מְזוּזָה?','בְּצַד יָמִין שֶׁל הַנִּכְנָס','בְּצַד שְׂמֹאל','בְּאֶמְצַע הַדֶּלֶת','כְּשֶׁנִּכְנָסִים – הַמְּזוּזָה בְּצַד יָמִין.'],
    ['מָה כָּתוּב בַּקְּלָף שֶׁל הַמְּזוּזָה?','"שְׁמַע יִשְׂרָאֵל" וְ"וְהָיָה אִם שָׁמֹעַ"','שֵׁם הַמִּשְׁפָּחָה','מַתְכּוֹן לְעוּגָה','שְׁתֵּי פָּרָשִׁיּוֹת מֵהַתּוֹרָה, בִּכְתַב יָד שֶׁל סוֹפֵר.'],
    ['כַּמָּה פְּעָמִים בְּשֶׁבַע שָׁנִים בּוֹדְקִים מְזוּזָה?','פַּעֲמַיִם','אַף פַּעַם','כָּל יוֹם','סוֹפֵר בּוֹדֵק שֶׁלֹּא נִמְחֲקָה אַף אוֹת.'],
    ['בְּאֵיזֶה גֹּבַהּ קוֹבְעִים אֶת הַמְּזוּזָה?','בַּשְּׁלִישׁ הָעֶלְיוֹן שֶׁל הַפֶּתַח','לְיַד הָרִצְפָּה','עַל הַתִּקְרָה','כָּךְ רוֹאִים אוֹתָהּ וְנוֹגְעִים בָּהּ.'],
    ['אֵיפֹה לֹא קוֹבְעִים מְזוּזָה?','בַּשֵּׁרוּתִים','בַּחֲדַר הַשֵּׁנָה','בַּמִּטְבָּח','בְּכָל חֶדֶר מְגוּרִים כֵּן – בַּשֵּׁרוּתִים וּבַמִּקְלַחַת לֹא.']],
 9:[['מָה הַמִּסְפָּר 18 בְּאוֹתִיּוֹת?','חַי','שָׁלוֹם','מַזָּל','ח=8, י=10. לָכֵן נוֹתְנִים צְדָקָה בִּכְפוּלוֹת שֶׁל 18!'],
    ['מָתַי נָהוּג לָתֵת צְדָקָה?','בְּכָל יוֹם חֹל, לִפְנֵי הַתְּפִלָּה','רַק בְּיוֹם הֻלֶּדֶת','רַק בְּשַׁבָּת','בְּשַׁבָּת לֹא נוֹגְעִים בְּכֶסֶף – אָז נוֹתְנִים כָּפוּל בְּיוֹם שִׁשִּׁי.'],
    ['מָה עוֹד נֶחְשָׁב חֶסֶד?','לַעֲזֹר לְחָבֵר וּלְחַיֵּךְ אֵלָיו','לִצְעֹק עַל אָח','לְהַסְתִּיר אֶת הַמַּמְתַּקִּים','גְּמִילוּת חֲסָדִים אֶפְשָׁר לַעֲשׂוֹת גַּם בְּלִי כֶּסֶף!'],
    ['אֵיךְ קוֹרְאִים לְקֻפַּת צְדָקָה בַּבַּיִת?','פּוּשְׁקֶע','מְגֵרָה','אַרְנָק','כְּדַאי שֶׁתִּהְיֶה פּוּשְׁקֶע בְּכָל חֶדֶר!']],
 10:[['כַּמָּה חֲתִיכוֹת לֶחֶם מַחְבִּיאִים לִבְדִיקַת חָמֵץ?','עֶשֶׂר','אַחַת','מֵאָה','כָּךְ נָהוּג – עֶשֶׂר חֲתִיכוֹת עֲטוּפוֹת.'],
    ['מָה אוֹכְלִים בְּפֶסַח בִּמְקוֹם לֶחֶם?','מַצָּה','פִּיצָה','לַחְמָנִיָּה','בְּנֵי יִשְׂרָאֵל יָצְאוּ מַהֵר, וְהַבָּצֵק לֹא הִסְפִּיק לִתְפֹּחַ.'],
    ['מִי שׁוֹאֵל "מַה נִּשְׁתַּנָּה" בַּסֵּדֶר?','הַיֶּלֶד הַקָּטָן','הַשָּׁכֵן','הֶחָתוּל','הַסֵּדֶר בָּנוּי כְּדֵי שֶׁהַיְּלָדִים יִשְׁאֲלוּ!'],
    ['מָה מַזְכִּיר הַמָּרוֹר?','אֶת הַקֹּשִׁי שֶׁל הָעַבְדוּת בְּמִצְרַיִם','אֶת הַשּׁוּק בְּמִצְרַיִם','אֶת הַיָּם','מָרוֹר מַר – כְּמוֹ הָעַבְדוּת.'],

function dreidel(onEnd){const L=[['נ','נֵס','לֹא קוֹרֶה כְּלוּם',0],['ג','גָּדוֹל','לוֹקְחִים הַכֹּל! +8 מַטְבְּעוֹת',8],['ה','הָיָה','לוֹקְחִים חֵצִי: +4 מַטְבְּעוֹת',4],['פ','פֹּה','שָׂמִים מַטְבֵּעַ בַּקֻּפָּה',0]];

  <div class="letters">${L.map(l=>`<span class="${got[l[0]]?'got':''}">${l[0]}</span>`).join('')}</div><div class="dreidel" id="dr">${res?res[0]:'?'}</div>

 bind({spin:()=>{if(busy||spins>=max)return;busy=true;spins++;kidTurn();const dr=$('dr');dr.classList.add('spin');beep(300,.6,'sine',.03);
   setTimeout(()=>{busy=false;const missing=L.filter(l=>!got[l[0]]);const r=(spins>=4&&missing.length&&Math.random()<.6)?rnd(missing):rnd(L);const was=Object.keys(got).length;got[r[0]]=1;if(r[3])addCoins(r[3]);addPts(2);

const mtof=m=>440*Math.pow(2,(m-69)/12);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function voice(m,t,d,v,dest){const a=ac();if(!a)return;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.setValueAtTime(v,t+Math.max(.03,d-.05));g.gain.linearRampToValueAtTime(0,t+d);
 const o1=a.createOscillator(),o2=a.createOscillator();o1.type='triangle';o2.type='square';o1.frequency.value=mtof(m);o2.frequency.value=mtof(m)*1.003;
 const g2=a.createGain();g2.gain.value=.25;const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=5.5;lg.gain.value=mtof(m)*.006;lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
 o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(dest||a.destination);[o1,o2,lfo].forEach(o=>{o.start(t);o.stop(t+d+.02);});}
function bassAt(m,t,d,v,dest){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=mtof(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||a.destination);o.start(t);o.stop(t+d+.02);}
const Music={on:false,name:null,timer:null,idx:0,next:0,bnext:0,bi:0,gain:null};
function musicStart(name){const a=ac();if(!a)return;musicStop();Music.name=name;Music.idx=0;Music.bi=0;Music.next=Music.bnext=a.currentTime+.15;Music.gain=a.createGain();Music.gain.gain.value=.55;Music.gain.connect(a.destination);
 Music.timer=setInterval(()=>{const tu=TUNES[Music.name];if(!tu)return;const spb=60/tu.bpm,hz=a.currentTime+.5;
  while(Music.next<hz){const [m,b]=tu.notes[Music.idx];voice(m,Music.next,b*spb*.95,.045,Music.gain);Music.next+=b*spb;Music.idx=(Music.idx+1)%tu.notes.length;}
  while(Music.bnext<hz){bassAt(Music.bi%2?45:50,Music.bnext,spb*.8,.12,Music.gain);if(tu.bpm>100)bassAt(62,Music.bnext+spb/2,.08,.04,Music.gain);Music.bnext+=spb;Music.bi++;}},90);}

/* ================= STAGE 7: NIGGUN PARTY (rhythm) ================= */
const LANE_X=[380,480,580],HIT_Y=410,LANE_N=['בָּם','בַּאי','בִּים'],LANE_C=['#e2475e','#ffc93c','#2f80ed'];
function startRhythm(onDone){R.rhDone=typeof onDone==='function'?onDone:null;musicStop();const a=ac();R.scene='rhythm';R.screen='play';cab.classList.add('isRhythm');hide();
 if(a&&a.state==='suspended')a.resume();
 const tu=TUNES.freilach,bpm=easy()?92:112,spb=60/bpm;let t=0;const ev=[];
 for(let rep=0;rep<2;rep++)for(const [m,b] of tu.notes){ev.push({m,t,d:b*spb,bp:t/spb});t+=b*spb;}
 const onBeat=e=>Math.abs(e.bp-Math.round(e.bp))<.01;
 const notes=ev.filter(e=>easy()?onBeat(e):(onBeat(e)||Math.random()<.45)).map(e=>({t:e.t,lane:e.m<66?0:(e.m<70?1:2),hit:0,miss:0}));
 const gain=a.createGain();gain.gain.value=.6;gain.connect(a.destination);const base=a.currentTime+3;
 for(const e of ev)voice(e.m,base+e.t,e.d*.92,.05,gain);
 for(let b=0;b*spb<t;b++){bassAt(b%2?45:50,base+b*spb,spb*.8,.14,gain);bassAt(62,base+b*spb+spb/2,.08,.05,gain);}
 R.rh={notes,base,end:t+1.2,fall:easy()?2.1:1.7,win:easy()?.27:.19,score:0,combo:0,best:0,hits:0,perfect:0,flash:[0,0,0],gain,spb,done:false};}
function rhythmHit(l){const rh=R.rh;if(!rh||rh.done)return;const now=AC.currentTime-rh.base;rh.flash[l]=.15;let best=null,bd=9;
 for(const n of rh.notes){if(n.lane!==l||n.hit||n.miss)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n;}}
 if(best&&bd<=rh.win){best.hit=1;rh.hits++;rh.combo++;rh.best=Math.max(rh.best,rh.combo);const perfect=bd<.08;if(perfect)rh.perfect++;rh.score+=(perfect?15:10)+Math.min(rh.combo,20);
  if(rh.combo%10===0){celebrate('אַחְלָה! רֶצֶף '+rh.combo+'!',60);floater(W/2,190,chabad(),'#fff');}else floater(LANE_X[l],HIT_Y-40,perfect?'מֻשְׁלָם!':'יָפֶה!',perfect?'#ffc93c':'#fff');}
 else{rh.combo=0;}}
function updateRhythm(dt){const rh=R.rh;if(!rh||rh.done)return;const now=AC.currentTime-rh.base;rh.flash=rh.flash.map(f=>Math.max(0,f-dt));
 for(const n of rh.notes)if(!n.hit&&!n.miss&&now>n.t+rh.win){n.miss=1;rh.combo=0;}
 if(now>rh.end){rh.done=true;finishRhythm();}}
function drawRhythm(){const rh=R.rh;const now=rh&&AC?AC.currentTime-rh.base:0;
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1650');g.addColorStop(1,'#5a2a6e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<24;i++){const x=i*42+10,y=30+Math.sin(i*.8)*10;ctx.fillStyle=['#ffc93c','#e2475e','#2f80ed','#3fa34d'][i%4];ctx.globalAlpha=.5+.5*Math.abs(Math.sin(R.t*3+i));ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();}ctx.globalAlpha=1;
 ctx.fillStyle='#ffc93c';ctx.font='900 26px '+FONT;ctx.textAlign='center';ctx.direction='rtl';ctx.fillText(R.stage===13?'רִקּוּדִים לִכְבוֹד יְחִיאֵל – מַזָּל טוֹב!':'מְסִבַּת נִגּוּנִים – שִׂמְחָה פּוֹרֶצֶת גֶּדֶר!',W/2,80);
 ctx.fillStyle='#7a4b2a';ctx.fillRect(0,GY-10,W,H);ctx.fillStyle='rgba(255,255,255,.06)';for(let x=0;x<W;x+=80)ctx.fillRect(x,GY-10,40,H);
 const spb=rh?rh.spb:.5,dancing=rh&&rh.combo>0,bounce=dancing?Math.abs(Math.sin(now*Math.PI/spb))*14:Math.abs(Math.sin(R.t*3))*3;
 drawP(ctx,200,GY+14-bounce,famLook('shimon',{face:1,armA:-2.4+Math.sin(R.t*8)*.4,moving:dancing,phase:R.t*10}));
 if(R.stage===13)drawP(ctx,200,GY-74-bounce,famLook('yechiel',{face:1,armA:-2.8+Math.sin(R.t*9)*.3,s:.85}));
 R.team.filter(k=>!(R.stage===13&&k==='yechiel')).forEach((k,i)=>{const x=50+(i%3)*55,y=GY+(i<3?-6:34);drawP(ctx,x+(i>=3?28:0),y-bounce*(i%2?1:.7),famLook(k,{face:1,armA:-2.4+Math.sin(R.t*8+i)*.4,moving:dancing,phase:R.t*10+i}));});
 ['rabbi','rebbetzin','racheli'].forEach((k,i)=>drawP(ctx,760+i*70,GY+14,famLook(k,{face:-1,armA:-1.4+Math.sin(R.t*9+i)*.5})));
 for(let l=0;l<3;l++){ctx.fillStyle='rgba(255,255,255,.08)';rr(ctx,LANE_X[l]-38,110,76,HIT_Y-80,10);ctx.fill();
  ctx.fillStyle=rh&&rh.flash[l]>0?'#fff':LANE_C[l];ctx.strokeStyle='#1a1410';ctx.lineWidth=4;ctx.beginPath();ctx.arc(LANE_X[l],HIT_Y,32,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a1410';ctx.font='900 18px '+FONT;ctx.fillText(LANE_N[l],LANE_X[l],HIT_Y+7);ctx.fillStyle='#fff';ctx.font='700 13px '+FONT;ctx.fillText('JKL'[l],LANE_X[l],HIT_Y+52);}
 if(!rh)return;
 for(const n of rh.notes){if(n.hit||n.miss)continue;const dtn=n.t-now;if(dtn>rh.fall||dtn<-.3)continue;const y=HIT_Y-(dtn/rh.fall)*(HIT_Y-110);
  ctx.fillStyle=LANE_C[n.lane];ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(LANE_X[n.lane],y,22,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 20px serif';ctx.fillText('♪',LANE_X[n.lane],y+7);}
 ctx.fillStyle='#fff';ctx.font='800 20px '+FONT;ctx.textAlign='right';ctx.fillText(`נְקֻדּוֹת: ${rh.score}`,W-20,130);ctx.fillText(`רֶצֶף: ${rh.combo}`,W-20,160);ctx.textAlign='center';
 if(now<0){ctx.fillStyle='#ffc93c';ctx.strokeStyle='#1a1410';ctx.lineWidth=8;ctx.font='900 90px '+FONT;const c=Math.ceil(-now);ctx.strokeText(c,W/2,300);ctx.fillText(c,W/2,300);}}
function finishRhythm(){const rh=R.rh;cab.classList.remove('isRhythm');if(rh){try{rh.gain.disconnect();}catch(e){}}
 const total=rh?rh.notes.length:1,acc=rh?rh.hits/total:0,stars=acc>.85?3:acc>.6?2:1;R.scene='show';
 addPts(Math.round((rh?rh.score:0)/5));addCoins(10+stars*5);celebrate(stars===3?'אַחְלָה! נִגּוּן מֻשְׁלָם!':'אַחְלָה! לְחַיִּים!',200,true);
 const cb=R.rhDone;bind({n:()=>{if(cb){R.rhDone=null;cb();}else quiz(shuffle(QUIZ[7]).slice(0,easy()?3:4),'חִידוֹן נִגּוּנִים וּפְסוּקִים',()=>finishStage());},again:()=>{R.rh=null;startRhythm(cb);}});

function headOf(who,icon,t){return `<div class="who">${pimg(who)}<span>${icon} ${t}</span></div>`+turnNow();}
function choiceSeries(o,next){const list=o.cases.slice(0,o.n||o.cases.length);let i=0;
 const ask=()=>{const c=list[i];const opts=shuffle(easy()?[[c.ok,1],[c.w[0],0]]:[[c.ok,1],[c.w[0],0],[c.w[1],0]]);
  bind({a:v=>{const ok=v==='1';if(ok){addPts(5);celebrate(c.cheer||cheerName(),80);}else sfx.oops();
   bind({nx:()=>{i++;if(i<list.length)ask();else next();}});
   show(`${o.head}<h2>${ok?'נָכוֹן!':'כִּמְעַט!'}</h2><p>${ok?'':'הַתְּשׁוּבָה: <b>'+c.ok+'</b>. '}</p><p class="fact">${c.fact}</p><div class="btns row"><button data-act="nx">${i<list.length-1?'הַבָּא':'הָלְאָה!'}</button></div>`);}});
  show(`${o.head}<h2>${o.title} (${i+1}/${list.length})</h2><div class="scroll">${c.d}</div><div class="btns">${opts.map((x,j)=>`<button class="alt" data-act="a" data-v="${x[1]}">${j+1}. ${x[0]}</button>`).join('')}</div>`);};
 ask();}
function matchTask(o,next){const list=shuffle(o.items);let i=0;
 const render=(msg='')=>{const it=list[i];show(`${o.head}<h2>${o.title} (${i+1}/${list.length})</h2>${msg?`<p class="say">${msg}</p>`:''}<div class="scroll"><span style="font-size:44px">${it.ic}</span>&nbsp; ${it.n}</div><div class="btns">${shuffle(Object.entries(o.options)).map(([k,v])=>`<button class="alt" data-act="m" data-v="${k}">${v}</button>`).join('')}</div>`);};
 bind({m:k=>{const it=list[i];if(!it)return;if(k===it.ans){addPts(4);celebrate(cheerName(),60);i++;if(i===list.length){setTimeout(next,900);return;}render(`נָכוֹן! ${it.n} – ${o.options[it.ans]}.`);}else{sfx.oops();render(easy()?`כִּמְעַט! ${it.n} – <b>${o.options[it.ans]}</b>.`:'לֹא בְּדִיּוּק – נַסֵּה שׁוּב!');}}});render();}

function updateDrop(dt){const D=R.drop;if(!D||!R.dropOn)return;R.timer-=dt;if(R.timer<=0){R.timer=0;endDrop(false);return;}
 let mv=0;if(keys.left)mv-=1;if(keys.right)mv+=1;const pl=R.player;pl.moving=mv!==0;if(mv){pl.face=mv;pl.x=Math.max(40,Math.min(W-40,pl.x+mv*(has('dobi')?420:300)*dt));pl.phase+=dt*12;}
 D.spawnT-=dt;if(D.spawnT<=0){D.spawnT=easy()?.7:.55;const good=Math.random()<.74;const it=good?rnd(D.cfg.good):rnd(D.cfg.bad);D.items.push({x:60+Math.random()*(W-120),y:-20,vy:(easy()?120:160)+Math.random()*70,rot:Math.random()*6,it,good});}
 for(const o of D.items){o.y+=o.vy*dt;o.rot+=dt*3;
  if(!o.dead&&o.y>GY-140&&o.y<GY-95&&Math.abs(o.x-pl.x)<52){o.dead=1;
   if(o.good){D.got++;R.count=D.got;addPts(2);beep(900+D.got*15,.05,'square',.03);if(D.got%6===0)floater(pl.x,GY-210,chabad(),'#fff');else if(D.got%4===0&&R.team.length){floater(pl.x,GY-240,cheerName(rnd(R.team)),'#ffc93c');}if(D.got>=D.cfg.need){endDrop(true);return;}}
   else{floater(pl.x,GY-210,o.it.msg,'#fff');sfx.oops();}}}
 D.items=D.items.filter(o=>!o.dead&&o.y<H+30);}
function drawDropItem(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(o.rot)*.5);const k=o.it.k;
 if(k==='coin'){ctx.fillStyle='#f5c518';ctx.strokeStyle='#a87e00';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#a87e00';ctx.font='900 15px '+FONT;ctx.textAlign='center';ctx.fillText('₪',0,6);}
 else if(k.startsWith('candy')){const c={candy1:'#e2475e',candy2:'#2f80ed',candy3:'#3fa34d',candy4:'#ffc93c'}[k];ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,0,13,9,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-22,-8);ctx.lineTo(-22,8);ctx.fill();ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(22,-8);ctx.lineTo(22,8);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(-4,-6,3,12);}
 else if(k==='button'){ctx.fillStyle='#8e8e9a';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.fillStyle='#444';for(const [a,b] of[[-4,-4],[4,-4],[-4,4],[4,4]]){ctx.beginPath();ctx.arc(a,b,2,0,7);ctx.fill();}}
 else if(k==='leaf'){ctx.fillStyle='#6aa84f';ctx.beginPath();ctx.ellipse(0,0,16,8,.4,0,7);ctx.fill();ctx.strokeStyle='#38761d';ctx.beginPath();ctx.moveTo(-14,-6);ctx.lineTo(14,6);ctx.stroke();}
 else if(k==='gum'){ctx.fillStyle='#ff8ad8';ctx.beginPath();ctx.arc(-5,0,9,0,7);ctx.arc(6,3,8,0,7);ctx.fill();}
 else if(k==='sock'){ctx.fillStyle='#7a4fc9';rr(ctx,-7,-18,14,26,4);ctx.fill();rr(ctx,-7,2,24,10,5);ctx.fill();}
 else if(k==='key'){ctx.strokeStyle='#c9a227';ctx.lineWidth=4;ctx.beginPath();ctx.arc(-8,0,7,0,7);ctx.moveTo(-1,0);ctx.lineTo(16,0);ctx.moveTo(12,0);ctx.lineTo(12,6);ctx.stroke();}
 ctx.restore();}

 if(D)for(const o of D.items)drawDropItem(o);
 R.team.forEach((k,i)=>drawP(ctx,60+i*52,GY+6,famLook(k,{face:1,armA:-2.4+Math.sin(R.t*8+i)*.3})));
 drawP(ctx,R.player.x,GY+8,famLook('shimon',{face:R.player.face,phase:R.player.phase,moving:R.player.moving,armA:-2.6}));
 const box=D&&D.cfg.box==='pushka';ctx.fillStyle=box?'#2f80ed':'#b07a3c';rr(ctx,R.player.x-40,GY-132,80,30,8);ctx.fill();ctx.strokeStyle='#1a1410';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='800 13px '+FONT;ctx.textAlign='center';ctx.direction='rtl';ctx.fillText(box?'צְדָקָה':'סַל',R.player.x,GY-112);
 if(D){ctx.fillStyle='rgba(255,255,255,.92)';rr(ctx,W-210,22,190,44,12);ctx.fill();ctx.fillStyle='#1a1410';ctx.font='900 22px '+FONT;ctx.fillText(`${D.cfg.label}: ${D.got}/${D.cfg.need}`,W-115,52);}}

function kidLook(){return{s:.62,hf:1.25,shirt:rnd(['#e2475e','#2f80ed','#3fa34d','#ffb627','#b07ad9','#3fb0ac']),pants:rnd(['#2b2b2b','#33405c']),skin:rnd(['#f6d0ad','#e8b892','#c98d68']),hair:rnd(['#3a2618','#a0522d','#d9a24c','#1a1a1a']),kippah:Math.random()<.5?rnd(['#2f80ed','#1a1a1a']):null};}
function newStops(){const n=easy()?2:3;const xs=shuffle([180,340,500,660,820]).slice(0,n).sort((a,b)=>a-b);return xs.map(x=>({x,kids:Array.from({length:1+Math.floor(Math.random()*3)},()=>({name:rnd(KIDN),look:kidLook()})),picked:false}));}
function startRoute(onEnd){R.scene='route';R.screen='play';hide();R.route={x:W+80,speed:easy()?80:110,stops:newStops(),pause:0,onEnd,joined:[],phase:0};R.count=0;R.goal=easy()?8:12;R.goalLabel='יְלָדִים הוֹלְכִים לְבֵית הַכְּנֶסֶת';R.timer=easy()?75:65;R.timerOn=true;R.routeOn=false;
 show(`${say('rabbi','בְּיוֹם טוֹב לֹא נוֹסְעִים – הוֹלְכִים בָּרֶגֶל! לוֹחֲצִים "עוֹצְרִים!" (אוֹ רֶוַח) כְּשֶׁמַּגִּיעִים לְבַיִת שֶׁיְּלָדִים מְחַכִּים לְיָדוֹ.')}<div class="btns row"><button data-act="go">הוֹלְכִים!</button></div>`);bind({go:()=>{hide();R.routeOn=true;}});}
function updateRoute(dt){const Ro=R.route;if(!Ro||!R.routeOn)return;R.timer-=dt;if(R.timer<=0){R.timer=0;endRoute();return;}
 if(Ro.pause>0){Ro.pause-=dt;return;}Ro.x-=Ro.speed*dt;Ro.phase+=dt*10;
 const tail=(1+R.team.length+Math.min(Ro.joined.length,14))*38;if(Ro.x<-tail){Ro.x=W+60;Ro.stops=newStops();}}
function routeStop(){const Ro=R.route;if(!Ro||!R.routeOn||Ro.pause>0)return;let hit=null;for(const s of Ro.stops)if(!s.picked&&s.kids.length&&Math.abs(Ro.x-s.x)<50)hit=s;
 if(hit){hit.picked=true;Ro.pause=.8;const n=hit.kids.length;R.count+=n;addPts(5*n);addCoins(n);Ro.joined.push(...hit.kids);celebrate(cheerPre()+hit.kids[0].name+'!',90);
  if(R.team.length){const hk=rnd(R.team);floater(hit.x,GY-230,FAM[hk].name+(FAM[hk].f?' דָּפְקָה בַּדֶּלֶת!':' דָּפַק בַּדֶּלֶת!'),'#ffc93c');}
  hit.kids=[];if(R.count>=R.goal)setTimeout(endRoute,900);}
 else{beep(250,.08,'sine',.04);floater(Ro.x,GY-220,'אֵין פֹּה יְלָדִים – מַמְשִׁיכִים לָלֶכֶת!','#fff');}}
function drawRouteScene(){sky();ctx.drawImage(bgT(),0,0,W,H);drawDecor();const Ro=R.route;if(!Ro)return;
 for(const s of Ro.stops){ctx.fillStyle='#7a4b2a';ctx.strokeStyle='#1a1410';ctx.lineWidth=3;rr(ctx,s.x-24,GY-150,48,90,6);ctx.fill();ctx.stroke();ctx.save();ctx.translate(s.x+32,GY-128);ctx.rotate(.25);ctx.fillStyle='#c9a227';ctx.fillRect(-3,-10,6,20);ctx.restore();
  s.kids.forEach((k,i)=>drawP(ctx,s.x+30+i*24,GY+4,Object.assign({},k.look,{face:1,armA:Math.sin(R.t*6+i)*.5-1.8})));
  if(s.kids.length&&Math.abs(Ro.x-s.x)<50){ctx.strokeStyle='#ffc93c';ctx.lineWidth=5;ctx.beginPath();ctx.arc(s.x,GY-80,62,0,7);ctx.stroke();}}
 const mv=Ro.pause<=0;drawP(ctx,Ro.x,GY+10,famLook('shimon',{face:-1,moving:mv,phase:Ro.phase}));
 R.team.forEach((k,i)=>drawP(ctx,Ro.x+44*(i+1),GY+10,famLook(k,{face:-1,moving:mv,phase:Ro.phase+i})));
 Ro.joined.slice(0,14).forEach((k,i)=>drawP(ctx,Ro.x+44*(R.team.length+1)+32*i,GY+12,Object.assign({},k.look,{face:-1,moving:mv,phase:Ro.phase+i,hold:'flag'})));
 ctx.fillStyle='rgba(255,255,255,.9)';rr(ctx,20,20,230,34,10);ctx.fill();ctx.fillStyle='#1a1410';ctx.font='800 15px '+FONT;ctx.textAlign='center';ctx.direction='rtl';ctx.fillText('🚶 בְּיוֹם טוֹב הוֹלְכִים בָּרֶגֶל',135,43);}

const D2LEN=15000,D2F=W-230;
function d2Track(seed){const r=mulberry(seed);const ev=[];let d=900;
 while(d<D2LEN-500){const t=r();if(t<.15){ev.push({type:'gate',d,ok:r()<.5?0:1,ic:['🕯️','📦','📜','🪙'][Math.floor(r()*4)]});d+=520;}

function d2Step(pl,dt,inp,ev){if(pl.fin)return;
 if(inp.u)pl.lane=0;if(inp.d)pl.lane=1;if(inp.j&&pl.jy<=.5){pl.vy=760;beep(520,.06,'triangle',.03);}

const GLOS={'חֲסִידוּת':'תּוֹרָה שֶׁגִּלָּה הַבַּעַל שֵׁם טוֹב – לַעֲבֹד אֶת ה׳ בְּשִׂמְחָה וּבְאַהֲבָה לְכָל יְהוּדִי.','הִתְוַעֲדוּת':'מִפְגָּשׁ שֶׁל חֲסִידִים סְבִיב שֻׁלְחָן – שָׁרִים נִגּוּנִים, אוֹמְרִים לְחַיִּים וּמְקַבְּלִים הַחְלָטוֹת טוֹבוֹת.','לְחַיִּים':'בְּרָכָה שֶׁאוֹמְרִים בְּהִתְוַעֲדוּת – "לְחַיִּים טוֹבִים וּלְשָׁלוֹם!"','שָׁלִיחַ':'מִי שֶׁהָרַבִּי שָׁלַח לְקָרֵב יְהוּדִים בְּכָל מָקוֹם בָּעוֹלָם.','מִבְצָעִים':'עֲשָׂרָה מִבְצָעִים שֶׁהָרַבִּי בִּקֵּשׁ – תְּפִלִּין, נֵרוֹת, מְזוּזָה, צְדָקָה וְעוֹד.','יֵצֶר טוֹב':'הַקּוֹל הַטּוֹב שֶׁבְּתוֹכֵנוּ שֶׁרוֹצֶה לַעֲשׂוֹת מִצְווֹת.','יֵצֶר הָרַע':'הַקּוֹל שֶׁמְּנַסֶּה לְהַפְרִיעַ לָנוּ לַעֲשׂוֹת טוֹב – וְאֶפְשָׁר לְנַצֵּחַ אוֹתוֹ!','אַדְמוֹ"ר הַזָּקֵן':'רַבִּי שְׁנֵיאוּר זַלְמָן מִלְּיָאדִי – הַנָּשִׂיא הָרִאשׁוֹן שֶׁל חַבַּ"ד וּמְחַבֵּר הַתַּנְיָא.','הַבַּעַל שֵׁם טוֹב':'רַבִּי יִשְׂרָאֵל – מְיַסֵּד תְּנוּעַת הַחֲסִידוּת.','תַּנְיָא':'הַסֵּפֶר הַיְּסוֹדִי שֶׁל חֲסִידוּת חַבַּ"ד, שֶׁכָּתַב אַדְמוֹ"ר הַזָּקֵן.','נִגּוּן':'מַנְגִּינָה חֲסִידִית – לִפְעָמִים בְּלִי מִלִּים – שֶׁפּוֹתַחַת אֶת הַלֵּב.','צְדָקָה':'לָתֵת לְמִי שֶׁצָּרִיךְ – מִצְוָה שֶׁעוֹשִׂים כָּל יוֹם.','תְּשׁוּבָה':'לַחֲזֹר לַדֶּרֶךְ הַטּוֹבָה – תָּמִיד אֶפְשָׁר!','מָשִׁיחַ':'הַמֶּלֶךְ שֶׁיָּבִיא אֶת הַגְּאֻלָּה הַשְּׁלֵמָה – מְחַכִּים לוֹ כָּל יוֹם.','מִדּוֹת':'הַתְּכוּנוֹת שֶׁל הַלֵּב – כְּמוֹ שִׂמְחָה, עֲנָוָה וְאֱמֶת.','הַחְלָטָה טוֹבָה':'דָּבָר טוֹב שֶׁמַּחְלִיטִים לַעֲשׂוֹת – וְעוֹשִׂים!'};

function vgroup(s){if(s.includes('וֹ'))return'o';if(s.includes('וּ')||s.includes('ֻ'))return'u';if(/[ֲַָ]/.test(s))return'a';if(/[ֱֵֶ]/.test(s))return'e';if(s.includes('ִ'))return'i';return null;}
function sbase(s){const ch=[...s];let b=ch[0];for(let i=1;i<ch.length;i++){if(/[ּׁׂ]/.test(ch[i]))b+=ch[i];else if(!/[ְ-ֻ]/.test(ch[i]))break;}return b;}
function syl(base,g){return g==='o'?base+'וֹ':g==='u'?base+'וּ':base+VOW[g].m[0];}
function qIntroLet(L){return{intro:1,html:`${BIG(L[0])}<p class="say" data-k="rebbetzin" style="text-align:center">זוֹ הָאוֹת <b>${L[1]}</b>. ${L[3]} ${L[2]} מַתְחִילָה בָּאוֹת ${L[1]}!</p>`,speak:[[L[1],'rebbetzin'],[L[2]+' מַתְחִילָה בָּאוֹת '+L[1],'rebbetzin']],g:L[0]};}
function qFind(L,pool){const opts=shuffle([L,...shuffle(pool.filter(x=>x[0]!==L[0])).slice(0,3)]);return{p:`אֵיפֹה הָאוֹת <b>${L[1]}</b>?`,sp:'אֵיפֹה הָאוֹת '+L[1]+'?',show:`<p style="text-align:center"><button class="small alt" data-act="hear">🔊 שׁוֹמְעִים אֶת שֵׁם הָאוֹת</button></p>`,hear:L[1],o:opts.map(x=>[x[0],x[0]===L[0]]),big:1,key:'L:'+L[0],g:'?'};}
function qName(L,pool){const opts=shuffle([L,...shuffle(pool.filter(x=>x[0]!==L[0])).slice(0,2)]);return{p:`אֵיךְ קוֹרְאִים לָאוֹת הַזֹּאת?`,show:BIG(L[0]),o:opts.map(x=>[x[1],x[0]===L[0]]),key:'L:'+L[0],g:L[0]};}
function qFirst(L,pool){const opts=shuffle([L,...shuffle(pool.filter(x=>x[0]!==L[0])).slice(0,3)]);return{p:`בְּאֵיזוֹ אוֹת מַתְחִילָה הַמִּלָּה?`,show:`<div class="remoji">${L[3]}</div><p style="text-align:center"><button class="small alt" data-act="hear">🔊 שׁוֹמְעִים: מָה זֶה?</button></p>`,hear:L[2],o:opts.map(x=>[x[0],x[0]===L[0]]),big:1,key:'L:'+L[0],g:'?'};}
function qGrid(t,others,name){const n=S.level==='easy'?8:12,k=S.level==='easy'?3:4;const cells=shuffle([...Array(k).fill(t),...Array(n-k).fill(0).map(()=>rnd(others))]);return{grid:cells,t,p:`מִצְאוּ אֶת כָּל הָאוֹתִיּוֹת <b>${name}</b> (${t})`,sp:'מִצְאוּ אֶת כָּל הָאוֹתִיּוֹת '+name,key:'L:'+t,g:t};}
function qEnd(F){const opts=shuffle([F,...shuffle(FINS.filter(x=>x[0]!==F[0])).slice(0,2)]);return{p:'בְּאֵיזוֹ אוֹת סוֹפִית נִגְמֶרֶת הַמִּלָּה?',show:`<div class="remoji">${F[3]}</div><p class="rfont" style="text-align:center;font-size:40px">${F[2].replace(/[ךםןףץ][ְ-ׇ]*$/,'_')}</p>`,o:opts.map(x=>[x[0],x[0]===F[0]]),big:1,key:'L:'+F[0],g:F[0]};}
function isOpenSyl(s){const bare=s.replace(/[\u0591-\u05C7]/g,'');return bare.length===1||(bare.length===2&&bare[1]==='ו'&&(s.includes('וֹ')||s.includes('וּ')));}
function qFirstSyl(w,groups){const s=w[2][0];const g=vgroup(s);const b=sbase(s);const og=(groups||[]).filter(x=>x!==g);const others=shuffle(og.length>=2?og:Object.keys(VOW).filter(x=>x!==g)).slice(0,2);
 return{p:'בְּאֵיזוֹ הֲבָרָה מַתְחִילָה הַמִּלָּה?',show:`<div class="remoji">${w[1]}</div><p style="text-align:center"><button class="small alt" data-act="hear">🔊 שׁוֹמְעִים</button></p>`,hear:w[0],o:shuffle([[s,1],...others.map(x=>[syl(b,x),0])]),big:1,key:'V:'+g,g:s};}
function qSame(g,base){const m=VOW[g].m;const a=syl(base,g),c=g==='a'?base+'ַ':g==='e'?base+'ֶ':base+'ֻ';const others=shuffle(Object.keys(VOW).filter(x=>x!==g)).slice(0,2);
 return{p:`אֵיזוֹ הֲבָרָה נִשְׁמַעַת בְּדִיּוּק כְּמוֹ <span class="rfont" style="font-size:1.6em">${a}</span>?`,o:shuffle([[c,1],...others.map(x=>[syl(base,x),0])]),big:1,key:'V:'+g,g:a};}
function qVName(g,base){const vn=rnd(VOW[g].n);const idx=VOW[g].n.indexOf(vn);const mk=g==='o'?base+'וֹ':g==='u'?(idx?base+'ֻ':base+'וּ'):base+VOW[g].m[idx];const others=shuffle(Object.keys(VOW).filter(x=>x!==g)).slice(0,2).map(x=>VOW[x].n[0]);
 return{p:'אֵיךְ קוֹרְאִים לַנִּקּוּד הַזֶּה?',show:BIG(mk),o:shuffle([[vn,1],...others.map(x=>[x,0])]),key:'V:'+g,g:mk};}
function qWordPic(w){const opts=shuffle([w,...shuffle(RW.filter(x=>x[1]!==w[1])).slice(0,S.level==='easy'?2:3)]);return{p:'קִרְאוּ אֶת הַמִּלָּה – וּבַחֲרוּ תְּמוּנָה:',show:BIG(w[0],'ttsSkip'),o:opts.map(x=>[x[1],x[0]===w[0]]),emo:1,key:'W:'+w[0],g:w[0],help:w[0]};}
function qPicWord(w){const sim=RW.filter(x=>x[0]!==w[0]&&x[1]!==w[1]).sort((a,b)=>simScore(b[0],w[0])-simScore(a[0],w[0])).slice(0,4);const opts=shuffle([w,...shuffle(sim).slice(0,S.level==='easy'?2:3)]);
 return{p:'אֵיזוֹ מִלָּה מַתְאִימָה לַתְּמוּנָה?',show:`<div class="remoji">${w[1]}</div>`,o:opts.map(x=>[x[0],x[0]===w[0]]),big:1,key:'W:'+w[0],g:w[1]};}
function simScore(a,b){const s=x=>new Set([...x].filter(c=>/[א-ת]/.test(c)));const A=s(a),B=s(b);let n=0;for(const c of A)if(B.has(c))n++;return n-Math.abs(a.length-b.length)*.1;}
function qBuild(w){return{build:w,p:'בּוֹנִים אֶת הַמִּלָּה – לוֹחֲצִים עַל הַהֲבָרוֹת לְפִי הַסֵּדֶר:',show:`<div class="remoji">${w[1]}</div>`,key:'W:'+w[0],g:w[1],hear:w[0]};}
function qSent(s){return{p:'בַּחֲרוּ אֶת הַמִּלָּה הַחֲסֵרָה:',show:BIG(s[0].replace('____','<span class="rblank">____</span>'),'rsent ttsSkip'),o:shuffle([[s[1],1],...s[2].map(x=>[x,0])]),big:1,key:'S:'+s[1],g:'✍️',help:s[0].replace('____','...')};}
function qSentPic(s){const opts=shuffle([s,...shuffle(RPICS.filter(x=>x!==s)).slice(0,2)]);return{p:'קִרְאוּ אֶת הַמִּשְׁפָּט – אֵיזוֹ תְּמוּנָה מַתְאִימָה?',show:BIG(s[0],'rsent ttsSkip'),o:opts.map(x=>[x[1],x===s]),emo:1,key:'S:'+s[0],g:'📖',help:s[0]};}
function qTF(s){return{p:'נָכוֹן אוֹ לֹא נָכוֹן?',show:BIG(s[0],'rsent ttsSkip'),o:[['✅ נָכוֹן',s[1]===1],['❌ לֹא נָכוֹן',s[1]===0]],key:'S:'+s[0],g:'🤔',help:s[0]};}
function readBuildQs(l){const easy=S.level==='easy';let qs=[];
 if(l.k==='let'){const set=l.set.map(i=>LETS[i]);const pool=LETS;qs=set.map(qIntroLet);const quiz=[];for(const L of set){quiz.push(qFind(L,pool));quiz.push(rnd([qFirst,qName])(L,pool));}
  quiz.push(qGrid(set[0][0],pool.filter(x=>x!==set[0]).map(x=>x[0]),set[0][1]));qs=qs.concat(shuffle(quiz).slice(0,easy?8:10));}
 else if(l.k==='fin'){qs=FINS.map(F=>({intro:1,html:`${BIG(F[0])}<p class="say" data-k="rebbetzin" style="text-align:center"><b>${F[1]}</b> – בָּאָה רַק בְּסוֹף מִלָּה: ${F[3]} <span class="rfont">${F[2]}</span></p>`,speak:[[F[1]+' בָּאָה רַק בְּסוֹף מִלָּה, כְּמוֹ '+F[2],'rebbetzin']],g:F[0]}));qs=qs.concat(shuffle(FINS.flatMap(F=>[qEnd(F),qName(F,FINS)])).slice(0,8));}
 else if(l.k==='sim'){qs=[{intro:1,html:`${BIG('ד ר')}<p class="say" data-k="rebbetzin">יֵשׁ אוֹתִיּוֹת שֶׁנִּרְאוֹת כִּמְעַט אוֹתוֹ דָּבָר! מִסְתַּכְּלִים טוֹב טוֹב: לַ-ד יֵשׁ פִּנָּה חַדָּה, וְלָ-ר – עֲגֻלָּה. וְהַנְּקֻדָּה בְּתוֹךְ בּ, כּ, פּ מְשַׁנָּה אֶת הַצְּלִיל!</p>`,g:'ד'}];
  const pk=shuffle([...SIMS]).slice(0,easy?6:8);for(const p of pk){if(Math.random()<.5)qs.push(qGrid(p[0],[p[1]],p[2]));else{const L=[p[0],p[2]],O=[p[1],p[3]];qs.push({p:'אֵיךְ קוֹרְאִים לָאוֹת הַזֹּאת?',show:BIG(L[0]),o:shuffle([[L[1],1],[O[1],0]]),key:'L:'+L[0],g:L[0]});}}}
 else if(l.k==='vow'){const all=l.all||l.g;qs=l.g.map(g=>({intro:1,html:`${BIG(VOW[g].n.map((n,i)=>g==='o'?'בּוֹ':g==='u'?(i?'בֻּ':'בּוּ'):'בּ'+VOW[g].m[i]).join('  '))}<p class="say" data-k="rebbetzin" style="text-align:center"><b>${VOW[g].n.join(' וְ')}</b> – אוֹמְרִים <b class="rfont">${VOW[g].s}</b>, כְּמוֹ בַּמִּלָּה <b class="rfont">${VOW[g].ex}</b>.</p>`,speak:[[VOW[g].n.join(' וְ')+', כְּמוֹ בַּמִּלָּה '+VOW[g].ex,'rebbetzin']],g:syl('בּ',g)}));
  const ws=RW.filter(w=>w[2].length>1&&isOpenSyl(w[2][0])&&all.includes(vgroup(w[2][0])));const bases=['בּ','מ','ל','ד','ש','נ','ת','ר'];const quiz=[];
  for(const w of shuffle(ws).slice(0,5))quiz.push(qFirstSyl(w,all));for(const g of l.g){if(['a','e','u'].includes(g))quiz.push(qSame(g,rnd(bases)),qSame(g,rnd(bases)));if(!easy||g!=='u')quiz.push(qVName(g,rnd(bases)));}

 else if(l.k==='w1'){qs=shuffle(RW.filter(w=>w[2].length<=2)).slice(0,easy?8:10).map(w=>Math.random()<.6?qWordPic(w):qPicWord(w));}

function readStart(id,qs){const l=RLES.find(x=>x.id===id)||{id:0,n:'תִּרְגּוּל חָכָם',ic:'🧠'};confirmLeave();cab.classList.add('isMP');R.scene='read';
